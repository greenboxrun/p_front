<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1"><title>173DAY · 기사 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{display:['Gowun Batang','serif'],sans:['Pretendard','sans-serif'],mono:['DM Mono','monospace']},colors:{ink:'#15221e',paper:'#f4f6f1',moss:'#2d7a5b',lime:'#d7ff4f',mist:'#dbe5df'},boxShadow:{card:'0 10px 28px rgba(21,34,30,.07)'}}}}</script>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
<div id="app" v-cloak>
  <header class="border-b border-ink/15 bg-paper/95 backdrop-blur"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4 sm:px-8"><a href="/" class="group flex items-center gap-3" aria-label="173DAY 홈"><span class="grid h-8 min-w-8 place-items-center rounded-full bg-ink px-1.5 text-[10px] font-bold tracking-[-.08em] text-lime transition-transform group-hover:rotate-12">173</span><span class="font-mono text-sm font-medium tracking-[.14em]">DAY</span></a><p class="hidden font-mono text-[11px] tracking-[.08em] text-ink/50 sm:block">ARTICLE JSON TESTER</p><button @click="openImport" class="rounded-full bg-ink px-4 py-2 text-sm font-semibold text-lime transition-colors hover:bg-moss">Import</button></div></header>
  <main v-if="!article" class="mx-auto flex min-h-[60vh] max-w-4xl items-center px-5 pb-16 pt-10 sm:px-8 sm:pt-16"><div class="w-full max-w-2xl"><p class="font-mono text-xs tracking-[.14em] text-moss">ARTICLE JSON TESTER</p><h1 class="mt-4 font-display text-4xl font-bold leading-[1.3] tracking-[-.055em] sm:text-5xl">기사 객체를 넣고<br><em class="font-normal text-moss">실제 화면으로 확인하세요.</em></h1><p class="mt-5 max-w-xl text-base leading-7 text-ink/65">현재 서비스에서 사용하는 기사 JSON 객체를 Import하면 기존 기사 상세 화면과 같은 모습으로 표시됩니다.</p><button @click="openImport" class="mt-8 rounded-full bg-ink px-5 py-3 text-sm font-semibold text-lime transition-colors hover:bg-moss">기사 JSON Import <span class="ml-2">↗</span></button></div></main>
  <article-view v-else :article="article" @home="clearArticle"></article-view>
  <div v-if="isImportOpen" class="modal-backdrop fixed inset-0 z-50 grid place-items-center p-4" @click.self="closeImport"><section role="dialog" aria-modal="true" aria-labelledby="import-title" class="w-full max-w-2xl rounded-2xl bg-paper p-6 shadow-2xl sm:p-8"><div class="flex items-start justify-between gap-4"><div><p class="font-mono text-xs tracking-[.14em] text-moss">IMPORT ARTICLE</p><h2 id="import-title" class="mt-2 font-display text-2xl font-bold">기사 JSON 붙여넣기</h2></div><button @click="closeImport" class="grid h-8 w-8 place-items-center rounded-full bg-mist text-lg text-ink/60 hover:bg-ink hover:text-lime" aria-label="모달 닫기">×</button></div><textarea ref="jsonInput" v-model="jsonText" @keydown.ctrl.enter.prevent="importArticle" @keydown.meta.enter.prevent="importArticle" class="mt-6 min-h-64 w-full resize-y rounded-xl border border-ink/15 bg-white/60 p-4 font-mono text-xs leading-6 outline-none focus:border-moss focus:ring-2 focus:ring-lime" placeholder="{\n  \"id\": 232,\n  \"title\": \"기사 제목\",\n  \"content\": []\n}"></textarea><p class="mt-2 text-xs text-ink/45">JSON 객체를 그대로 붙여넣으세요. Ctrl/Cmd + Enter로 바로 적용할 수 있습니다.</p><p v-if="errorMessage" class="mt-4 rounded-lg border border-red-900/15 bg-red-50 px-3 py-2 text-sm leading-6 text-red-900">{{ errorMessage }}</p><div class="mt-6 flex justify-end gap-3"><button @click="closeImport" class="rounded-full px-4 py-2 text-sm font-semibold text-ink/60 hover:bg-mist">취소</button><button @click="importArticle" class="rounded-full bg-ink px-5 py-2 text-sm font-semibold text-lime hover:bg-moss">적용하기</button></div></section></div>
</div><script src="js/article-data.js?v=1"></script><script src="js/article-view.js?v=2"></script><script>
  const { createApp, ref, nextTick } = Vue;
  createApp({
    components: { ArticleView: window.ArticleView },
    setup() {
      const article = ref(null), isImportOpen = ref(false), jsonText = ref(''), errorMessage = ref(''), jsonInput = ref(null);
      const openImport = () => { isImportOpen.value = true; errorMessage.value = ''; nextTick(() => jsonInput.value?.focus()); };
      const closeImport = () => { isImportOpen.value = false; errorMessage.value = ''; };
      const clearArticle = () => { article.value = null; window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const importArticle = () => { try { article.value = window.normalizeArticle(window.parseArticleJson(jsonText.value)); closeImport(); } catch (error) { errorMessage.value = error instanceof SyntaxError ? `JSON 형식을 확인해 주세요. 마지막 항목 뒤의 쉼표는 자동으로 정리합니다: ${error.message}` : error.message; } };
      return { article, isImportOpen, jsonText, errorMessage, jsonInput, openImport, closeImport, clearArticle, importArticle };
    }
  }).mount('#app');
</script>
</body></html>
